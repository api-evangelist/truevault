aid: truevault
name: TrueVault
description: >-
  TrueVault provides developer infrastructure for storing and managing sensitive
  personal data in a compliant way. Its original product, TrueVault Safe, is a
  HIPAA-oriented REST API and secure datastore that lets applications create
  Vaults and store encrypted Documents, BLOBs, Users, and Schemas, with
  group-based access control (the Access Grid), full-text and geospatial Search,
  transactional Email/SMS messaging, password-reset flows, and scoped access
  tokens. Authentication is via API keys or user access tokens passed in an HTTP
  Basic header. TrueVault's newer Polaris product is privacy-compliance software
  that helps ecommerce brands comply with US state privacy laws, the GDPR, and
  the CCPA. TrueVault is a Y Combinator-backed company.
