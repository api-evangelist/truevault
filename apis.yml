  description: >-
    TrueVault Safe is a REST API and secure datastore for sensitive personal
    data. Resources include Users, Groups (with policy-based Access Grid
    permissions), Vaults, BLOBs, Documents, Schemas, Search (full-text and
    geospatial), Messaging (Email and SMS), Password Reset Flows, and Scoped
    Access Tokens. Requests are authenticated with an API key or user access
    token via HTTP Basic; responses are JSON envelopes carrying result and
    transaction_id. Base URL https://api.truevault.com/v1.
